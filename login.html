<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Confidencial | Agência Date♥Tive</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="login-body">

    <header class="topbar">
        <div class="container nav-wrapper" style="justify-content: center;">
            <a href="index.html" class="logo-area">
                <img src="assets/img/logo.png" alt="Logo DateTive" class="site-logo">
                <div class="logo-text">
                    <span class="logo-title">DATE♥TIVE</span>
                </div>
            </a>
        </div>
    </header>

    <section class="login-section">
        <div class="login-container-wrapper">

            <div class="login-header">
                <h2>BEM-VINDO DETETIVE</h2>
                
            </div>

            <div class="login-glass-card">
                <form class="login-form">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="exemplo@datetive.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>


                </form>
            </div>

            <div class="login-actions-wrapper" style="text-align: center;">
                <a href="#" class="forgot-password-central">Esqueceu a sua senha secreta?</a>

                <button type="button" class="cta-main-btn full-width" style="margin-top: 20px;">ENTRAR NA
                    AGÊNCIA</button>

                <div class="login-footer">
                    <p>Ainda não é um investigador? <a href="#">Criar distintivo</a></p>
                    <p style="margin-top: 25px;"><a href="index.html" class="back-home">← Voltar ao início</a></p>
                </div>
            </div>

        </div>
    </section>

    <script src="main.js"></script>
</body>

</html>
